name: Build themes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # The sparse Rock checkout only changes when .rock-version does.
      - uses: actions/cache@v4
        with:
          path: .rock-src
          key: rock-src-${{ hashFiles('.rock-version') }}

      # postinstall runs `npm run sync`, which fills ./Styles from Rock at .rock-version.
      # Once package-lock.json is committed, switch this to `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      # Only what the server needs, laid out like RockWeb/Themes/: built CSS and static
      # assets, not the Less/Sass sources that produced them. Rock's own NextGen core
      # styles (Styles/styles-v2/) aren't included either — the Rock install on the
      # target server already has them.
      - uses: actions/upload-artifact@v4
        with:
          name: rock-themes-${{ github.sha }}
          path: |
            Themes/
            !Themes/**/*.less
            !Themes/**/*.scss
          if-no-files-found: error

  # Deployment is deploy.yml: push to a server's dedicated branch (e.g. `staging`) to
  # build and deploy to that environment's Azure VM automatically.
